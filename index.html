<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jackson AI 🍋⚡</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;

    /* 🍋⚡ Yellow → White Linear Gradient */
    background: linear-gradient(
      to bottom,
      #FFD700 0%,
      #FFE44D 25%,
      #FFEE99 50%,
      #FFF7CC 75%,
      #FFFFFF 100%
    );
  }

  h1 {
    font-size: 2.5rem;
    color: #333;
    margin-bottom: 8px;
    text-align: center;
  }

  .tagline {
    color: #666;
    margin-bottom: 32px;
    font-size: 1rem;
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(255, 215, 0, 0.3);
  }

  h3 {
    color: #333;
    margin-bottom: 16px;
    font-size: 1.1rem;
  }

  textarea {
    width: 100%;
    min-height: 120px;
    padding: 14px;
    font-size: 1rem;
    font-family: inherit;
    border: 2px solid #FFE44D;
    border-radius: 10px;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus {
    border-color: #FFD700;
    box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.2);
  }

  button {
    margin-top: 14px;
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    color: #333;
    background: linear-gradient(135deg, #FFD700, #FFEE99);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
  }

  button:active {
    transform: translateY(0);
  }
</style>
</head>
<body>

  <h1>🍋⚡ Jackson AI</h1>
  <p class="tagline">Make any game </p>

  <div class="card">
    <h3>Create any game</h3>
    <textarea id="prompt" placeholder="Ask anything... e.g. 'Make a space shooter with power-ups'"></textarea>
    <button onclick="generateGame()">Generate Game ⚡</button>
  </div>

<script>
  function generateGame() {
    const prompt = document.getElementById('prompt').value.trim();

    // Redirect to studio.jacker.ai with the prompt as a query param
    const url = 'https://studio.jacker.ai' +
      (prompt ? '?prompt=' + encodeURIComponent(prompt) : '');

    window.location.href = url;
  }

  // Optional: press Ctrl/Cmd + Enter to submit
  document.getElementById('prompt').addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      generateGame();
    }
  });
</script>

</body>
</html>
